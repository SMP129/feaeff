<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SytheTierList — Minecraft PvP Rankings</title>

<!-- New logo line added for Browser Tab / Favicon -->
<link rel="icon" type="image/x-icon" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQfR9v4z7TrFOdFDNSX2uTm0_fAPt9JkNBkGT_m9eGUSA&s=10">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0710;
    --bg-2:#0f0b1a;
    --panel:#15101f;
    --panel-line:rgba(255,255,255,0.07);
    --text:#f2eefc;
    --text-dim:#a99fc0;
    --text-faint:#6e6382;

    --gold:#ffb92e;
    --gold-2:#ff7a1a;
    --violet:#8b5cf6;
    --violet-2:#4c3bd6;
    --emerald:#31c48d;
    --rose:#f4437c;
    --sky:#38b6ff;

    --t1:#ffcc33; --t1b:#ff9d1a;
    --t2:#ff8a3d; --t2b:#ff5a1f;
    --t3:#ef4d5e; --t3b:#c026a3;
    --t4:#7c5cff; --t4b:#4f6bff;
    --t5:#4fb2ff; --t5b:#5c6b8a;

    --radius-lg:26px;
    --radius-md:18px;
    --radius-sm:12px;
  }

  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    background:
      radial-gradient(1100px 600px at 15% -5%, rgba(139,92,246,0.16), transparent 60%),
      radial-gradient(900px 500px at 100% 10%, rgba(255,122,26,0.10), transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:'Inter', sans-serif;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none;}
  ::selection{background:var(--gold); color:#1a1208;}

  h1,h2,h3,.display{
    font-family:'Fredoka', sans-serif;
    font-weight:600;
    letter-spacing:-0.01em;
    line-height:1.04;
  }
  .mono{font-family:'JetBrains Mono', monospace; letter-spacing:0.14em;}

  .wrap{max-width:1180px; margin:0 auto; padding:0 28px;}

  /* ---------- glint shimmer keyframes ---------- */
  @keyframes glintSweep{
    0%{ transform:translateX(-140%) skewX(-18deg); }
    38%,100%{ transform:translateX(240%) skewX(-18deg); }
  }
  .glint{ position:relative; overflow:hidden; isolation:isolate; }
  .glint::after{
    content:"";
    position:absolute;
    top:-40%; left:0;
    width:34%; height:180%;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,0.55), rgba(255,255,255,0.05), transparent);
    animation:glintSweep 3.6s ease-in-out infinite;
    animation-delay:var(--glint-delay, 0s);
    pointer-events:none;
    mix-blend-mode:overlay;
  }
  @media (prefers-reduced-motion: reduce){
    .glint::after{ animation:none; display:none; }
    html{scroll-behavior:auto;}
  }

  /* ---------- nav ---------- */
  nav{
    position:sticky; top:0; z-index:50;
    background:rgba(10,7,16,0.72);
    backdrop-filter:blur(14px);
    border-bottom:1px solid var(--panel-line);
  }
  .nav-inner{
    max-width:1180px; margin:0 auto; padding:16px 28px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .logo{display:flex; align-items:center; gap:10px; font-family:'Fredoka'; font-weight:600; font-size:19px;}
  .logo-badge{
    width:34px; height:34px; border-radius:10px;
    background:linear-gradient(145deg, var(--gold), var(--gold-2));
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 0 22px rgba(255,170,30,0.55);
    font-size:17px;
  }
  .nav-links{display:flex; gap:34px; font-size:14px; font-weight:600; color:var(--text-dim);}
  .nav-links a{transition:color .2s;}
  .nav-links a:hover{color:var(--text);}
  .nav-cta{
    padding:10px 20px; border-radius:999px; font-size:13.5px; font-weight:700;
    background:linear-gradient(120deg, var(--violet-2), var(--violet));
    box-shadow:0 4px 20px rgba(139,92,246,0.35);
  }
  @media (max-width:820px){ .nav-links{display:none;} }

  /* ---------- hero ---------- */
  .hero{ padding:96px 0 64px; text-align:center; position:relative; }

  /* Styling for inline Logo image */
  .hero-logo-img{
    width:90px; height:90px;
    border-radius:20px;
    margin:0 auto 20px auto;
    display:block;
    box-shadow:0 0 25px rgba(255,185,46,0.3);
  }

  @keyframes floatBlock{
    0%,100%{ transform:translateY(0) rotate(var(--r,0deg)); }
    50%{ transform:translateY(-16px) rotate(var(--r,0deg)); }
  }
  .mc-block{
    position:absolute;
    image-rendering:pixelated;
    filter:drop-shadow(0 8px 18px rgba(0,0,0,0.45));
    animation:floatBlock 6s ease-in-out infinite;
    z-index:0;
    pointer-events:none;
  }
  @media (max-width:820px){ .mc-block{ display:none; } }
  @media (prefers-reduced-motion: reduce){ .mc-block{ animation:none; } }
  .eyebrow{
    display:inline-flex; align-items:center; gap:12px;
    font-size:12px; font-weight:700; color:var(--gold);
    text-transform:uppercase; letter-spacing:0.32em;
    margin-bottom:22px;
  }
  .eyebrow .line{ width:26px; height:1px; background:linear-gradient(90deg, transparent, var(--gold)); }
  .eyebrow .line.r{ background:linear-gradient(90deg, var(--gold), transparent); }

  .hero h1{
    font-size:clamp(48px, 9vw, 92px);
    background:linear-gradient(180deg, #ffffff 20%, #cfc4ea 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .hero h1 .accent{
    background:linear-gradient(100deg, var(--sky), var(--violet) 45%, var(--rose) 80%, var(--gold));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .hero p.sub{
    max-width:560px; margin:22px auto 38px;
    color:var(--text-dim); font-size:17px; line-height:1.65;
  }
  .hero p.sub b{color:var(--text); font-weight:700;}

  .btn-row{display:flex; gap:16px; justify-content:center; flex-wrap:wrap; margin-bottom:56px;}
  .btn{
    display:inline-flex; align-items:center; gap:10px;
    padding:16px 30px; border-radius:16px;
    font-family:'Fredoka'; font-weight:600; font-size:16px;
    border:1px solid transparent; cursor:pointer;
  }
  .btn-primary{
    background:linear-gradient(120deg, var(--violet-2), var(--violet) 55%, #a06bff);
    box-shadow:0 10px 34px rgba(139,92,246,0.4), inset 0 1px 0 rgba(255,255,255,0.25);
    --glint-delay:0s;
  }
  .btn-ghost{
    background:rgba(255,255,255,0.03);
    border-color:var(--panel-line);
    color:var(--text);
  }
  .btn-ghost:hover{ background:rgba(255,255,255,0.06); }

  .stat-strip{
    display:grid; grid-template-columns:repeat(4, 1fr);
    max-width:760px; margin:0 auto;
    background:var(--panel);
    border:1px solid var(--panel-line);
    border-radius:22px; overflow:hidden;
  }
  .stat{ padding:26px 14px; text-align:center; border-right:1px solid var(--panel-line); }
  .stat:last-child{ border-right:none; }
  .stat b{ display:block; font-family:'Fredoka'; font-size:30px; margin-bottom:4px; }
  .stat span{ font-size:11.5px; letter-spacing:0.14em; text-transform:uppercase; color:var(--text-faint); font-weight:700; }
  @media (max-width:640px){ .stat-strip{ grid-template-columns:repeat(2,1fr);} .stat:nth-child(2){border-right:none;} }

  /* ---------- section shared ---------- */
  section.block{ padding:92px 0; position:relative; }
  .section-head{ text-align:center; max-width:640px; margin:0 auto 56px; }
  .section-head h2{ font-size:clamp(32px,5vw,46px); margin:16px 0 18px; }
  .section-head h2 .c1{ color:var(--gold); }
  .section-head h2 .c2{
    background:linear-gradient(100deg, var(--rose), var(--violet));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .section-head p{ color:var(--text-dim); font-size:16px; line-height:1.65; }

  /* ---------- ladder ---------- */
  .ladder-wrap{
    display:grid; grid-template-columns:1.1fr 1fr; gap:64px; align-items:start;
  }
  @media (max-width:900px){ .ladder-wrap{ grid-template-columns:1fr; } }

  .rungs{ display:flex; flex-direction:column; gap:9px; }
  .crown{ text-align:center; font-size:26px; color:var(--gold); filter:drop-shadow(0 0 12px rgba(255,190,50,0.7)); margin-bottom:6px; }
  .rung{ display:flex; align-items:center; gap:14px; }
  .rung .bar{
    height:30px; border-radius:999px; flex:1;
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.25), inset 0 -6px 10px rgba(0,0,0,0.18);
  }
  .rung .rlabel{ font-family:'JetBrains Mono'; font-size:12px; font-weight:700; color:var(--text-faint); width:38px; }
  .rung:nth-child(2) .bar{ background:linear-gradient(90deg, var(--t1), var(--t1b)); width:100%; }
  .rung:nth-child(3) .bar{ background:linear-gradient(90deg, var(--t1b), var(--t2)); width:94%; }
  .rung:nth-child(4) .bar{ background:linear-gradient(90deg, var(--t2), var(--t2b)); width:88%; }
  .rung:nth-child(5) .bar{ background:linear-gradient(90deg, var(--t2b), var(--t3)); width:82%; }
  .rung:nth-child(6) .bar{ background:linear-gradient(90deg, var(--t3), #ef4d5e); width:76%; }
  .rung:nth-child(7) .bar{ background:linear-gradient(90deg, #c026a3, #a239e0); width:70%; }
  .rung:nth-child(8) .bar{ background:linear-gradient(90deg, var(--t4b), var(--t4)); width:64%; }
  .rung:nth-child(9) .bar{ background:linear-gradient(90deg, #5b6bcf, #6f7fe0); width:58%; }
  .rung:nth-child(10) .bar{ background:linear-gradient(90deg, var(--t5), #63c4ff); width:52%; }
  .rung:nth-child(11) .bar{ background:linear-gradient(90deg, #7a8296, #57607a); width:46%; }

  .tier-cards{ display:flex; flex-direction:column; gap:14px; }
  .tier-card{
    display:flex; align-items:center; gap:18px;
    background:var(--panel); border:1px solid var(--panel-line);
    border-radius:var(--radius-md); padding:18px 20px;
    transition:transform .2s, border-color .2s;
  }
  .tier-card:hover{ transform:translateX(4px); border-color:rgba(255,255,255,0.16); }
  .tier-badge{
    width:52px; height:52px; border-radius:14px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-family:'Fredoka'; font-weight:700; font-size:22px;
    border:1px solid; position:relative;
  }
  .tier-card h3{ font-size:17px; margin-bottom:2px; }
  .tier-card p{ font-size:13.5px; color:var(--text-faint); font-weight:500; }
  .tier-crown{ margin-left:auto; font-size:18px; color:var(--gold); filter:drop-shadow(0 0 8px rgba(255,190,50,0.65)); }

  .tc-1{ --glint-delay:.2s; border-color:rgba(255,205,60,0.45); background:linear-gradient(135deg, rgba(255,190,40,0.10), var(--panel) 55%); }
  .tc-1 .tier-badge{ background:rgba(255,190,40,0.12); border-color:rgba(255,190,40,0.5); color:var(--t1); }
  .tc-2 .tier-badge{ background:rgba(255,120,50,0.10); border-color:rgba(255,120,50,0.4); color:var(--t2); }
  .tc-3 .tier-badge{ background:rgba(240,70,90,0.10); border-color:rgba(240,70,90,0.4); color:var(--t3); }
  .tc-4 .tier-badge{ background:rgba(140,110,255,0.10); border-color:rgba(140,110,255,0.4); color:var(--t4); }
  .tc-5 .tier-badge{ background:rgba(80,170,255,0.10); border-color:rgba(80,170,255,0.4); color:var(--t5); }

  /* ---------- arenas ---------- */
  .arena-grid{
    display:grid; grid-template-columns:repeat(3, 1fr); gap:18px;
  }
  @media (max-width:900px){ .arena-grid{ grid-template-columns:repeat(2,1fr);} }
  @media (max-width:560px){ .arena-grid{ grid-template-columns:1fr;} }

  .arena-card{
    position:relative;
    background:var(--panel); border:1px solid var(--panel-line);
    border-radius:var(--radius-md); padding:26px 22px;
    transition:transform .25s, border-color .25s, background .25s;
  }
  .arena-card:hover{ transform:translateY(-4px); border-color:var(--a-color, var(--violet)); }
  .arena-num{
    position:absolute; top:20px; right:22px;
    font-family:'JetBrains Mono'; font-size:12px; color:var(--text-faint); font-weight:700;
  }
  .arena-icon{
    width:50px; height:50px; border-radius:13px;
    display:flex; align-items:center; justify-content:center; font-size:22px;
    background:radial-gradient(circle at 30% 25%, var(--a-color, var(--violet)) 0%, transparent 70%), rgba(255,255,255,0.03);
    border:1px solid var(--panel-line);
    margin-bottom:20px;
  }
  .arena-icon img{ width:26px; height:26px; object-fit:contain; }
  .btn img.ico-svg{ width:19px; height:19px; object-fit:contain; }
  .nav-cta img.ico-svg{ width:16px; height:16px; object-fit:contain; margin-right:2px; }
  .arena-card h3{ font-family:'Fredoka'; font-size:19px; font-weight:600; margin-bottom:6px; }
  .arena-card .view{
    font-size:13px; font-weight:700; color:var(--text-dim);
    display:inline-flex; align-items:center; gap:6px; margin-top:8px;
  }
  .arena-card .view span{ transition:transform .2s; }
  .arena-card:hover .view span{ transform:translateX(3px); }
  .arena-card:hover .view{ color:var(--a-color, var(--violet)); }

  /* ---------- about ---------- */
  .about-wrap{ display:grid; grid-template-columns:1fr 1fr; gap:60px; align-items:center; }
  @media (max-width:900px){ .about-wrap{ grid-template-columns:1fr; gap:38px; } }
  .about-wrap h2{ font-size:clamp(30px,4.4vw,42px); margin-bottom:20px; }
  .about-wrap p{ color:var(--text-dim); font-size:16px; line-height:1.75; margin-bottom:16px; }
  .about-wrap p b{ color:var(--text); }
  .pill-row{ display:flex; flex-direction:column; gap:12px; margin-top:26px; }
  .pill{
    display:flex; align-items:center; gap:14px;
    background:var(--panel); border:1px solid var(--panel-line);
    border-radius:14px; padding:16px 18px; font-weight:700; font-size:15px;
  }
  .pill .ico{ width:34px; height:34px; border-radius:9px; display:flex; align-items:center; justify-content:center; font-size:16px; }
  .pill.green .ico{ background:rgba(49,196,141,0.15); color:var(--emerald); }
  .pill.purple .ico{ background:rgba(139,92,246,0.15); color:var(--violet); }
  .pill.gold .ico{ background:rgba(255,185,46,0.15); color:var(--gold); }

  .rank-preview{
    background:var(--panel); border:1px solid var(--panel-line);
    border-radius:var(--radius-lg); padding:8px;
  }
  .rank-row{
    display:flex; align-items:center; gap:14px; padding:14px 16px;
    border-radius:14px;
  }
  .rank-row + .rank-row{ margin-top:2px; }
  .rank-row:hover{ background:rgba(255,255,255,0.03); }
  .rank-pos{ font-family:'JetBrains Mono'; font-weight:700; color:var(--text-faint); width:22px; }
  .rank-avatar{ width:36px; height:36px; border-radius:9px; background:linear-gradient(135deg,#182029,#0d1218); overflow:hidden; display:flex; align-items:flex-end; justify-content:center; flex:0 0 auto; }
  .rank-avatar img{ width:30px; image-rendering:pixelated; }
  .rank-name{ font-weight:700; font-size:14.5px; flex:1; }
  .name-gold-shine{
    background:linear-gradient(90deg, #fff9e0 0%, #ffd479 20%, #fff9e0 40%, #ffb92e 60%, #fff9e0 80%, #ffd479 100%);
    background-size:200% auto;
    -webkit-background-clip:text; background-clip:text;
    color:transparent; -webkit-text-fill-color:transparent;
    animation:goldShine 3.2s linear infinite;
    text-shadow:0 0 14px rgba(255,201,90,.35);
  }
  @keyframes goldShine{
    0%{ background-position:0% center; }
    100%{ background-position:200% center; }
  }
  @media (prefers-reduced-motion: reduce){
    .name-gold-shine{ animation:none; }
  }
  .rank-tier{
    font-family:'JetBrains Mono'; font-size:11px; font-weight:700; padding:5px 10px; border-radius:999px;
  }
  .rt-ht1{ background:rgba(255,190,40,0.15); color:var(--t1); }
  .rt-lt1{ background:rgba(255,140,30,0.15); color:var(--gold-2); }
  .rt-ht2{ background:rgba(255,120,50,0.15); color:var(--t2); }
  .rt-ht3{ background:rgba(239,77,94,0.15); color:var(--t3); }
  .rt-lt3{ background:rgba(200,40,170,0.15); color:#e26bd0; }
  .rt-ht4{ background:rgba(140,110,255,0.15); color:var(--t4); }

  /* ---------- final cta ---------- */
  .final-cta{
    text-align:center; padding:80px 40px; margin:0 auto;
    max-width:900px;
    background:
      radial-gradient(500px 260px at 50% 0%, rgba(139,92,246,0.28), transparent 70%),
      linear-gradient(160deg, #1c1330, #120c1e);
    border:1px solid rgba(255,255,255,0.09);
    border-radius:32px;
  }
  .final-cta h2{ font-size:clamp(30px,5vw,44px); margin-bottom:16px; }
  .final-cta p{ color:var(--text-dim); max-width:440px; margin:0 auto 34px; font-size:15.5px; line-height:1.7; }

  footer{
    padding:50px 0 40px; text-align:center;
    border-top:1px solid var(--panel-line); margin-top:40px;
  }
  footer .logo{ justify-content:center; margin-bottom:10px; }
  footer .fine{ color:var(--text-faint); font-size:13px; }
  .admin-fab{
    position:fixed; left:18px; bottom:18px; z-index:50;
    display:flex; align-items:center; gap:7px;
    background:rgba(21,16,31,0.9);
    border:1px solid var(--panel-line);
    color:var(--text-faint);
    font-size:12.5px; font-weight:600;
    padding:9px 14px;
    border-radius:999px;
    text-decoration:none;
    backdrop-filter:blur(6px);
    transition:color .15s, border-color .15s, background .15s;
  }
  .admin-fab:hover{ color:var(--text-hi); border-color:rgba(255,255,255,.2); background:rgba(21,16,31,1); }
  .admin-fab svg{ width:14px; height:14px; opacity:.8; }
  .music-btn{
    display:inline-flex; align-items:center; gap:9px;
    margin:18px 0 22px;
    padding:12px 22px;
    border-radius:999px;
    background:linear-gradient(135deg, rgba(255,180,60,.12), rgba(255,60,60,.12));
    border:1px solid rgba(255,180,90,.35);
    color:#ffd479;
    font-weight:700; font-size:14.5px;
    text-decoration:none;
    transition:transform .15s ease, box-shadow .15s ease, background .15s ease;
  }
  .music-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 10px 26px -10px rgba(255,140,40,.45);
    background:linear-gradient(135deg, rgba(255,180,60,.2), rgba(255,60,60,.2));
  }
  .music-btn .note{ font-size:17px; }

  ::-webkit-scrollbar{ width:10px; }
  ::-webkit-scrollbar-track{ background:var(--bg); }
  ::-webkit-scrollbar-thumb{ background:#2a2138; border-radius:8px; }

  /* ---------- rankings / leaderboard ---------- */
  #rankings .lb-shell{
    background:var(--panel); border:1px solid var(--panel-line);
    border-radius:var(--radius-lg); padding:26px 22px 10px;
  }
  .lb-tabs{ display:flex; gap:10px; overflow-x:auto; padding-bottom:16px; margin-bottom:18px; border-bottom:1px solid var(--panel-line); scrollbar-width:none; }
  .lb-tabs::-webkit-scrollbar{ display:none; }
  .lb-tab{
    flex-shrink:0; width:44px; height:44px; border-radius:13px;
    display:flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,0.03); border:1px solid var(--panel-line);
    cursor:pointer; transition:.2s; font-size:18px;
  }
  .lb-tab img{ width:20px; height:20px; object-fit:contain; opacity:.85; }
  .lb-tab.active{ background:rgba(255,185,46,0.14); border-color:var(--gold); box-shadow:0 0 0 3px rgba(255,185,46,0.12); }
  .lb-search{
    display:flex; align-items:center; gap:12px;
    background:rgba(255,255,255,0.03); border:1px solid var(--panel-line);
    border-radius:16px; padding:15px 18px; margin-bottom:22px;
  }
  .lb-search svg{ flex-shrink:0; opacity:.5; }
  .lb-search input{
    background:none; border:none; outline:none; color:var(--text);
    font-family:'Inter'; font-size:15px; width:100%;
  }
  .lb-search input::placeholder{ color:var(--text-faint); }

  .lb-head{ display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:14px; margin-bottom:22px; }
  .lb-count{ font-family:'JetBrains Mono'; font-size:12.5px; letter-spacing:.14em; color:var(--text-faint); font-weight:700; }
  .lb-count b{ color:var(--gold); }
  .lb-info{
    display:flex; align-items:center; gap:8px;
    background:rgba(255,255,255,0.04); border:1px solid var(--panel-line);
    border-radius:999px; padding:9px 16px; font-size:12.5px; font-weight:700;
    color:var(--text-dim); cursor:pointer;
  }

  .lb-list{ display:flex; flex-direction:column; gap:14px; padding-bottom:22px; }
  .lb-card{
    background:rgba(255,255,255,0.02); border:1px solid var(--panel-line);
    border-radius:var(--radius-md); padding:18px 20px; cursor:pointer;
    transition:transform .18s, border-color .18s, background .18s;
  }
  .lb-card:hover{ transform:translateY(-2px); border-color:rgba(255,255,255,0.18); background:rgba(255,255,255,0.035); }
  .lb-top{ display:flex; align-items:center; gap:14px; margin-bottom:14px; flex-wrap:wrap; }
  .lb-rank{
    width:42px; height:42px; border-radius:11px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-family:'Fredoka'; font-weight:700; font-size:16px;
  }
  .lb-rank.r1{ background:linear-gradient(145deg,#ffd23f,#ff9d1a); color:#2a1900; box-shadow:0 0 18px rgba(255,180,40,0.5); }
  .lb-rank.r2{ background:linear-gradient(145deg,#d7dde6,#9aa4b2); color:#20242c; }
  .lb-rank.r3{ background:linear-gradient(145deg,#e79a55,#b96a2e); color:#2a1700; }
  .lb-rank.rn{ background:rgba(255,255,255,0.05); border:1px solid var(--panel-line); color:var(--text-dim); }
  .lb-avatar{
    width:44px; height:44px; border-radius:11px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-family:'Fredoka'; font-weight:700; font-size:15px; color:#fff;
  }
  .lb-id{ flex:1; min-width:140px; }
  .lb-name{ font-family:'Fredoka'; font-weight:600; font-size:16.5px; }
  .lb-sub{ font-size:12.5px; color:var(--gold); font-weight:700; display:flex; align-items:center; gap:5px; margin-top:2px; }
  .lb-sub .pts{ color:var(--text-dim); font-weight:600; }
  .lb-region{
    font-family:'JetBrains Mono'; font-size:11px; font-weight:700;
    background:rgba(56,182,255,0.14); color:var(--sky);
    padding:6px 12px; border-radius:999px; flex-shrink:0;
  }
  .lb-chips{ display:flex; flex-wrap:wrap; gap:8px; }
  .lb-chip{
    display:flex; flex-direction:column; align-items:center; gap:4px;
    width:44px;
  }
  .lb-chip .dot{
    width:38px; height:38px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    border:1px solid rgba(255,255,255,0.08);
  }
  .lb-chip .dot img{ width:17px; height:17px; object-fit:contain; }
  .lb-chip .code{ font-family:'JetBrains Mono'; font-size:9.5px; font-weight:700; color:var(--text-faint); }
  .lb-chip.unranked .dot{ background:rgba(255,255,255,0.03) !important; opacity:.4; }

  .lb-empty{ text-align:center; padding:50px 20px; color:var(--text-faint); font-size:14px; display:none; }

  /* ---------- profile modal ---------- */
  .modal-backdrop{
    position:fixed; inset:0; z-index:200;
    background:rgba(5,3,10,0.72); backdrop-filter:blur(6px);
    display:none; align-items:flex-start; justify-content:center;
    padding:40px 18px; overflow-y:auto;
  }
  .modal-backdrop.open{ display:flex; }
  .modal-card{
    width:100%; max-width:560px;
    background:linear-gradient(180deg, #1c1530, #100b1a);
    border:1px solid rgba(255,255,255,0.1);
    border-radius:28px; padding:32px 26px 26px;
    position:relative;
    animation:modalIn .22s ease;
  }
  @keyframes modalIn{ from{ opacity:0; transform:translateY(14px) scale(.98);} to{ opacity:1; transform:none; } }
  .modal-close{
    position:absolute; top:22px; right:22px;
    width:38px; height:38px; border-radius:50%;
    background:rgba(255,255,255,0.06); border:1px solid var(--panel-line);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; color:var(--text-dim); font-size:16px;
  }
  .modal-title-row{ display:flex; align-items:center; gap:16px; margin-bottom:22px; padding-right:40px; }
  .modal-avatar{
    width:70px; height:70px; border-radius:18px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-family:'Fredoka'; font-weight:700; font-size:26px; color:#fff;
    position:relative;
  }
  .modal-crown{ position:absolute; bottom:-8px; right:-8px; width:26px; height:26px; border-radius:50%; background:linear-gradient(145deg,#ffd23f,#ff9d1a); display:flex; align-items:center; justify-content:center; font-size:13px; box-shadow:0 0 12px rgba(255,180,40,.6); }
  .modal-badge{ font-size:12px; font-weight:700; color:var(--gold); display:flex; align-items:center; gap:6px; margin-bottom:4px; }
  .modal-name{ font-family:'Fredoka'; font-size:26px; font-weight:600; }
  .modal-meta{ font-size:12.5px; color:var(--text-faint); margin-top:5px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .modal-meta .vf{ color:var(--gold); font-weight:700; display:flex; align-items:center; gap:4px; }

  .modal-stats{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:20px; }
  .modal-stats div{ background:rgba(255,255,255,0.03); border:1px solid var(--panel-line); border-radius:14px; padding:16px 10px; text-align:center; }
  .modal-stats b{ display:block; font-family:'Fredoka'; font-size:22px; margin-bottom:2px; }
  .modal-stats span{ font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--text-faint); font-weight:700; }

  .modal-desc{ font-size:14px; color:var(--text-dim); line-height:1.6; margin-bottom:22px; }
  .modal-desc b{ color:var(--text); }
  .modal-desc .hl{ color:var(--gold); font-weight:700; }

  .modal-section-label{ font-family:'JetBrains Mono'; font-size:11px; letter-spacing:.18em; color:var(--text-faint); font-weight:700; margin-bottom:14px; }
  .radar-wrap{ display:flex; justify-content:center; margin-bottom:26px; }
  .radar-wrap svg text{ font-family:'JetBrains Mono'; font-size:9.5px; font-weight:700; letter-spacing:.06em; fill:var(--text-faint); }
  .radar-wrap svg text.hl{ fill:var(--gold); }

  .modal-disc-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:24px; }
  .modal-disc{
    display:flex; align-items:center; gap:10px;
    background:rgba(255,255,255,0.03); border:1px solid var(--panel-line);
    border-radius:12px; padding:11px 12px; font-size:13px; font-weight:700;
  }
  .modal-disc img{ width:18px; height:18px; object-fit:contain; }
  .modal-disc .dcode{ margin-left:auto; font-family:'JetBrains Mono'; font-size:11.5px; color:var(--text-dim); }
  .modal-disc.strongest{ border-color:rgba(255,185,46,0.4); background:rgba(255,185,46,0.06); }
  .modal-disc.strongest .dcode{ color:var(--gold); }
  .modal-disc .star{ color:var(--gold); font-size:11px; }

  .modal-actions{ display:flex; gap:12px; }
  .modal-actions a, .modal-actions button{
    flex:1; padding:15px; border-radius:14px; font-family:'Fredoka'; font-weight:600; font-size:14.5px;
    border:1px solid var(--panel-line); background:rgba(255,255,255,0.03); color:var(--text);
    cursor:pointer; text-align:center; display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .modal-actions .primary{ background:linear-gradient(120deg,#ffcc33,#ff9d1a); color:#241600; border:none; }
  @media (max-width:480px){ .modal-disc-grid{ grid-template-columns:1fr; } }

</style>
</head>
